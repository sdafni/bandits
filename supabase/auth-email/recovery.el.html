<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Επαναφορά κωδικού SafeKey</title>
    <style>
      body { margin: 0; padding: 0; background: #f8fafc; color: #0f172a; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .container { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
      .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px 24px; }
      .logo { font-size: 20px; font-weight: 700; color: #0f2343; letter-spacing: 0.02em; }
      h1 { margin: 20px 0 12px; font-size: 26px; line-height: 1.2; color: #0f172a; }
      p { margin: 0 0 14px; line-height: 1.65; font-size: 15px; color: #334155; }
      .cta { display: inline-block; margin: 14px 0 8px; background: #0f172a; color: #ffffff !important; text-decoration: none; font-weight: 700; border-radius: 12px; padding: 12px 18px; }
      .muted { font-size: 13px; color: #475569; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="logo">SafeKey</div>
        <h1>Επαναφορά κωδικού</h1>
        <p>Λάβαμε αίτημα για επαναφορά του κωδικού SafeKey.</p>
        <p>Αν το αίτημα έγινε από εσένα, συνέχισε με ασφάλεια από το κουμπί.</p>
        <a class="cta" href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/login/reset-password">Επαναφορά κωδικού</a>
        <p class="muted">Αν δεν ζήτησες επαναφορά κωδικού, αγνόησε αυτό το μήνυμα.</p>
      </div>
    </div>
  </body>
</html>
